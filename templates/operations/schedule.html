{% extends "base.html" %}
{% load static %}

{% block title %}Расписание{% endblock %}

{% block extra_head %}
<style>
  #calendar { max-width: 100%; margin: 0; min-height: 400px; }
  .fc-toolbar-title { font-size: 1.2rem !important; }
  .fc-event { border-radius: 4px !important; cursor: pointer !important; border-left-width: 4px !important; border-left-style: solid !important; }
  .fc-daygrid-event { padding: 2px 6px !important; }
  .fc-timegrid-event { padding: 3px 6px !important; }
  .fc-event .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; flex-shrink: 0; }
  .fc-event-title { font-weight: 500 !important; }
  .fc-event-time { font-size: .8em !important; }

  #status-legend { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: .5rem; }
  #status-legend span { display: flex; align-items: center; gap: 4px; font-size: .8rem; }

  #filter-bar label { font-size: .85rem; }

  .schedule-mode-switch {
    display: inline-flex;
    gap: 6px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, .72);
    box-shadow: var(--shadow-sm);
  }
  .schedule-mode-switch .btn {
    border-radius: 999px;
    white-space: nowrap;
  }
  .schedule-mode-switch .is-active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .schedule-mode-switch .btn:not(.is-active) {
    background: rgba(255, 255, 255, .84);
    border-color: var(--line-strong);
    color: var(--text);
  }
  .schedule-mode-switch .btn:not(.is-active):hover {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .schedule-staff-day {
    display: grid;
    gap: 12px;
  }
  .staff-day-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: rgba(255, 255, 255, .72);
    box-shadow: var(--shadow-sm);
    backdrop-filter: var(--glass-blur);
  }
  .staff-day-date-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .staff-day-date-controls input {
    width: auto;
    min-width: 154px;
    min-height: 34px;
    padding: 6px 10px;
  }
  .staff-day-date-controls .btn {
    min-width: 38px;
    min-height: 38px;
    background: rgba(255, 255, 255, .84);
    border-color: var(--line-strong);
    color: var(--text);
    box-shadow: none;
  }
  .staff-day-date-controls .btn:hover {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .staff-day-date-controls .btn.btn-outline-success {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .staff-day-nav-symbol {
    font-size: 22px;
    font-weight: 900;
    line-height: 1;
  }
  .staff-day-meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }
  .staff-day-board {
    overflow: auto;
    max-height: calc(100vh - 230px);
    min-height: 520px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background:
      linear-gradient(135deg, rgba(255, 255, 255, .82), rgba(245, 250, 252, .76)),
      repeating-linear-gradient(0deg, rgba(8, 35, 44, .025) 0 2px, transparent 2px 4px);
    box-shadow: var(--shadow-md);
  }
  .staff-day-grid {
    display: grid;
    align-items: start;
    min-width: max-content;
  }
  .staff-day-corner,
  .staff-day-column-head {
    position: sticky;
    top: 0;
    z-index: 4;
    min-height: 68px;
    border-bottom: 1px solid var(--line-strong);
    background: rgba(248, 252, 253, .94);
    backdrop-filter: var(--glass-blur);
  }
  .staff-day-corner {
    left: 0;
    z-index: 6;
    display: grid;
    place-items: center;
    border-right: 1px solid var(--line-strong);
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }
  .staff-day-column-head {
    display: grid;
    gap: 2px;
    align-content: center;
    padding: 10px 12px;
    border-right: 1px solid var(--line);
  }
  .staff-day-column-head strong {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--heading);
    font-size: 14px;
  }
  .staff-day-column-head span {
    color: var(--muted);
    font-size: 12px;
  }
  .staff-day-column-head::before {
    content: "";
    display: block;
    width: 36px;
    height: 4px;
    border-radius: 999px;
    background: var(--staff-color, var(--accent));
  }
  .staff-day-time-column {
    position: sticky;
    left: 0;
    z-index: 3;
    height: var(--timeline-height);
    border-right: 1px solid var(--line-strong);
    background: rgba(248, 252, 253, .95);
  }
  .staff-day-tick {
    position: absolute;
    left: 0;
    right: 0;
    min-height: 1px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }
  .staff-day-tick span {
    position: absolute;
    top: -9px;
    right: 10px;
    padding: 1px 4px;
    background: rgba(248, 252, 253, .96);
  }
  .staff-day-lane {
    position: relative;
    height: var(--timeline-height);
    min-width: 220px;
    border-right: 1px solid var(--line);
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(112, 141, 152, .22) 0 1px,
        transparent 1px calc(var(--half-hour-height) - 1px),
        rgba(112, 141, 152, .12) calc(var(--half-hour-height) - 1px) var(--half-hour-height)
      ),
      linear-gradient(180deg, rgba(255, 255, 255, .54), rgba(255, 255, 255, .28));
  }
  .staff-day-lane:hover {
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0, 164, 67, .25) 0 1px,
        transparent 1px calc(var(--half-hour-height) - 1px),
        rgba(112, 141, 152, .12) calc(var(--half-hour-height) - 1px) var(--half-hour-height)
      ),
      linear-gradient(180deg, rgba(0, 164, 67, .045), rgba(255, 255, 255, .3));
  }
  .staff-day-slot-hit {
    position: absolute;
    left: 0;
    right: 0;
    z-index: 1;
    text-decoration: none;
  }
  .staff-day-slot-hit:hover {
    background: rgba(0, 164, 67, .08);
    outline: 1px dashed rgba(0, 164, 67, .32);
    outline-offset: -2px;
  }
  .staff-day-now {
    position: absolute;
    left: 0;
    right: 0;
    z-index: 2;
    height: 2px;
    background: var(--danger);
    box-shadow: 0 0 0 1px rgba(198, 40, 23, .14);
  }
  .staff-day-card {
    position: absolute;
    left: 8px;
    right: 8px;
    z-index: 3;
    display: grid;
    align-content: start;
    gap: 2px;
    min-height: 30px;
    padding: 6px 8px;
    overflow: hidden;
    border: 1px solid color-mix(in srgb, var(--staff-color, #3b82f6) 52%, #1f2937);
    border-left: 5px solid var(--staff-color, #3b82f6);
    border-radius: 8px;
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--staff-color, #3b82f6) 24%, white), rgba(255, 255, 255, .86));
    color: #12262e;
    text-decoration: none;
    box-shadow: 0 8px 18px rgba(8, 35, 44, .12);
  }
  .staff-day-card:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 26px rgba(8, 35, 44, .16);
  }
  .staff-day-card-time {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 11px;
    font-weight: 900;
    line-height: 1.1;
  }
  .staff-day-card strong {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    line-height: 1.15;
  }
  .staff-day-card small {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: rgba(18, 38, 46, .78);
    font-size: 11px;
    line-height: 1.15;
  }
  .staff-day-card.is-compact small,
  .staff-day-card.is-compact .staff-day-card-badges {
    display: none;
  }
  .staff-day-card-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 2px;
  }
  .staff-day-badge {
    display: inline-flex;
    align-items: center;
    min-height: 16px;
    padding: 1px 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .72);
    color: #12262e;
    font-size: 10px;
    font-weight: 900;
  }
  .staff-day-card[data-status="proposed"],
  .staff-day-card[data-status="reserved"] {
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--status-color, #ea580c) 20%, white), rgba(255, 255, 255, .86));
  }
  .staff-day-card[data-status="completed"] {
    opacity: .76;
  }
  .staff-day-empty {
    margin: 18px;
    padding: 18px;
    border: 1.5px dashed var(--line-strong);
    border-radius: var(--radius-sm);
    color: var(--muted);
    text-align: center;
    font-weight: 700;
  }

  @media (max-width: 768px) {
    #filter-bar .row > div { margin-bottom: .5rem; }
    .fc-toolbar.fc-header-toolbar { flex-direction: column; gap: .5rem; }
    .fc-toolbar-chunk { display: flex; justify-content: center; flex-wrap: wrap; gap: .25rem; }
    .fc-toolbar-title { font-size: 1rem !important; }
    .fc-button { font-size: .75rem !important; padding: .25rem .5rem !important; }
    #status-legend { gap: .5rem; }
    #calendar { min-height: 300px; }
    .staff-day-toolbar { align-items: stretch; flex-direction: column; }
    .staff-day-meta { justify-content: flex-start; }
    .staff-day-board { max-height: calc(100vh - 270px); }
  }
</style>
{% endblock %}

{% block content %}
<section class="page-header d-flex justify-content-between align-items-center mb-3">
  <div>
    <h1 class="h3 mb-0">Расписание</h1>
  </div>
  <div class="header-actions">
    <div class="schedule-mode-switch" role="group" aria-label="Режим расписания">
      <button id="staffDayMode" type="button" class="btn btn-sm btn-outline-success">
        <i class="bi bi-columns-gap"></i> День по специалистам
      </button>
      <button id="calendarMode" type="button" class="btn btn-sm btn-outline-success">
        <i class="bi bi-calendar-week"></i> Календарь
      </button>
    </div>
    <a class="btn btn-primary btn-sm" href="{% url 'appointment_create' %}"><i class="bi bi-plus-lg"></i> Создать занятие</a>
  </div>
</section>

<section id="filter-bar" class="bg-white border rounded p-2 shadow-sm mb-3">
  <div class="row g-2 align-items-center">
    <div class="col-auto">
      <label class="form-label small fw-semibold mb-0">Специалист</label>
      <select id="staffFilter" class="form-select form-select-sm" style="min-width:160px">
        <option value="">Все</option>
      </select>
    </div>
    <div class="col-auto">
      <label class="form-label small fw-semibold mb-0">Услуга</label>
      <select id="serviceFilter" class="form-select form-select-sm" style="min-width:160px">
        <option value="">Все</option>
      </select>
    </div>
    <div class="col-auto d-flex align-items-end gap-2">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="showUnavailable" checked>
        <label class="form-check-label small" for="showUnavailable">Отпуска/отгулы</label>
      </div>
    </div>
  </div>
</section>

<section id="calendar-section">
  <div id="calendar"></div>
</section>

<section id="staff-day-section" class="schedule-staff-day d-none" aria-label="День по специалистам">
  <div class="staff-day-toolbar">
    <div class="staff-day-date-controls">
      <button id="staffDayPrev" type="button" class="btn btn-sm btn-outline-secondary" aria-label="Предыдущий день">
        <span class="staff-day-nav-symbol" aria-hidden="true">‹</span>
      </button>
      <input id="staffDayDate" class="form-control form-control-sm" type="date" value="{{ day|date:'Y-m-d' }}" aria-label="Дата расписания">
      <button id="staffDayNext" type="button" class="btn btn-sm btn-outline-secondary" aria-label="Следующий день">
        <span class="staff-day-nav-symbol" aria-hidden="true">›</span>
      </button>
      <button id="staffDayToday" type="button" class="btn btn-sm btn-outline-success">Сегодня</button>
    </div>
    <div id="staffDayMeta" class="staff-day-meta">
      <span>Загрузка расписания...</span>
    </div>
  </div>
  <div
    id="staffDaySchedule"
    class="staff-day-board"
    data-initial-day="{{ day|date:'Y-m-d' }}"
    data-create-url="{% url 'appointment_create' %}"
  >
    <div class="staff-day-empty">Загрузка расписания...</div>
  </div>
</section>

<!-- Status Legend -->
<div id="status-legend" class="mb-3"></div>

<!-- Detail Modal -->
<div class="modal fade" id="appointmentModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Занятие</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalBody">
        <p id="modalChild"></p>
        <p id="modalService"></p>
        <p id="modalStaff"></p>
        <p id="modalRoom"></p>
        <p id="modalTime"></p>
        <p id="modalStatus"></p>
      </div>
      <div class="modal-footer">
        <a id="modalDetailLink" class="btn btn-outline-primary btn-sm" href="#">Подробнее</a>
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Закрыть</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'operations/fullcalendar/index.global.min.js' %}"></script>
<script>
(function(){
  var el = document.getElementById("calendar");
  if (!el) { console.error("#calendar not found"); return; }
  if (typeof FullCalendar === "undefined") {
    el.innerHTML = '<div class="alert alert-warning">Не удалось загрузить календарь.</div>';
    return;
  }

  function getCookie(name) {
    var m = document.cookie.match(new RegExp("(^| )" + name + "=([^;]+)"));
    return m ? m[2] : "";
  }

  // Detect CSP
  var cspBlocked = false;
  try { new Function(""); } catch(e) { cspBlocked = true; }
  if (cspBlocked) {
    el.innerHTML = '<div class="alert alert-warning">Календарь не работает: CSP блокирует eval(). Отключите расширение (NoScript/ScriptSafe) для localhost.</div>';
    return;
  }

  // Russian locale
  FullCalendar.globalLocales.push({
    code: "ru",
    week: { dow: 1, doy: 4 },
    buttonText: { prev: "Пред", next: "След", today: "Сегодня", year: "Год", month: "Месяц", week: "Неделя", day: "День", list: "Повестка дня" },
    weekText: "Нед", allDayText: "Весь день",
    moreLinkText: function(n) { return "+ ещё " + n; },
    noEventsText: "Нет событий"
  });

  var statusDefs = {
    draft:     { label:"Черновик",    color:"#9ca3af" },
    proposed:  { label:"Предложено",  color:"#ea580c" },
    confirmed: { label:"Согласовано", color:"#16a34a" },
    reserved:  { label:"Бронь",       color:"#a855f7" },
    completed: { label:"Проведено",   color:"#6b7280" },
    cancelled: { label:"Отменено",    color:"#ef4444" },
    no_show:   { label:"Неявка",      color:"#dc2626" },
    rescheduled:{label:"Перенесено",  color:"#f59e0b" }
  };

  // Build legend
  var legendEl = document.getElementById("status-legend");
  for (var k in statusDefs) {
    var s = document.createElement("span");
    s.innerHTML = '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + statusDefs[k].color + '"></span> ' + statusDefs[k].label;
    legendEl.appendChild(s);
  }

  var calendar = new FullCalendar.Calendar(el, {
    locale: "ru",
    initialView: "dayGridMonth",
    firstDay: 1,
    height: "auto",
    headerToolbar: { left:"prev,next today", center:"title", right:"dayGridMonth,timeGridWeek,timeGridDay,listWeek" },
    slotMinTime: "08:00:00",
    slotMaxTime: "20:00:00",
    slotDuration: "00:30:00",
    eventSources: [
      {
        id: "appointments",
        url: "/api/appointments/",
        method: "GET",
        extraParams: function(info) {
          try { return { start: info.start.toISOString(), end: info.end.toISOString() }; }
          catch(e) { return {}; }
        },
        failure: function(e) { console.error("Appointments API error:", e); }
      },
      {
        id: "unavailability",
        url: "/api/unavailability/",
        method: "GET",
        extraParams: function(info) {
          try { return { start: info.start.toISOString(), end: info.end.toISOString() }; }
          catch(e) { return {}; }
        },
        failure: function(e) { console.error("Unavailability API error:", e); }
      }
    ],
    eventContent: function(arg) {
      if (arg.event.source && arg.event.source.id === "unavailability") {
        return { html: arg.event.title };
      }
      var p = arg.event.extendedProps;
      var html = '<span class="status-dot" style="background:' + (p.statusColor || "#999") + '"></span>';
      html += '<strong>' + arg.timeText + '</strong> ' + arg.event.title;
      return { html: html };
    },
    eventDidMount: function(info) {
      if (info.event.source && info.event.source.id === "unavailability") {
        var cb = document.getElementById("showUnavailable");
        info.el.style.display = cb && cb.checked ? "" : "none";
        return;
      }
      var p = info.event.extendedProps;
      if (p && p.staffId) info.el.dataset.staffId = p.staffId;
      if (p && p.serviceId) info.el.dataset.serviceId = p.serviceId;
      var staffFilter = document.getElementById("staffFilter");
      var serviceFilter = document.getElementById("serviceFilter");
      if (staffFilter && staffFilter.value && p.staffId && String(p.staffId) !== staffFilter.value) info.el.style.display = "none";
      if (serviceFilter && serviceFilter.value && p.serviceId && String(p.serviceId) !== serviceFilter.value) info.el.style.display = "none";
    },
    eventClick: function(info) {
      if (info.event.source && info.event.source.id === "unavailability") return;
      var p = info.event.extendedProps;
      document.getElementById("modalTitle").textContent = info.event.title || "";
      document.getElementById("modalChild").textContent = "Получатель: " + (p.child || "");
      document.getElementById("modalService").textContent = "Услуга: " + (p.service || "");
      document.getElementById("modalStaff").textContent = "Специалист: " + (p.staff || "");
      document.getElementById("modalRoom").textContent = "Кабинет: " + (p.room || "");
      document.getElementById("modalTime").textContent = "Время: " + (info.event.start ? info.event.start.toLocaleString("ru-RU") : "") + " — " + (info.event.end ? info.event.end.toLocaleString("ru-RU") : "");
      document.getElementById("modalStatus").textContent = "Статус: " + (statusDefs[p.status] ? statusDefs[p.status].label : p.status || "");
      document.getElementById("modalDetailLink").href = "/appointments/" + info.event.id + "/";
      var modal = new bootstrap.Modal(document.getElementById("appointmentModal"));
      modal.show();
    },
    eventDrop: function(info) {
      var start = info.event.start.toISOString();
      var end = info.event.end ? info.event.end.toISOString() : start;
      fetch("/api/appointments/" + info.event.id + "/move/", {
        method: "PATCH",
        headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
        body: JSON.stringify({ starts_at: start, ends_at: end })
      }).then(function(r) {
        if (!r.ok) { alert("Ошибка переноса: " + r.status); info.revert(); }
      }).catch(function() { info.revert(); });
    },
    editable: true, selectable: true, selectMirror: true, eventDurationEditable: true, nowIndicator: true
  });

  calendar.render();
  window.rmScheduleCalendar = calendar;

  // Filters
  document.getElementById("staffFilter").addEventListener("change", function() {
    var v = this.value;
    document.querySelectorAll(".fc-event").forEach(function(e) {
      e.style.display = (v && e.dataset.staffId && e.dataset.staffId !== v) ? "none" : "";
    });
  });
  document.getElementById("serviceFilter").addEventListener("change", function() {
    var v = this.value;
    document.querySelectorAll(".fc-event").forEach(function(e) {
      e.style.display = (v && e.dataset.serviceId && e.dataset.serviceId !== v) ? "none" : "";
    });
  });
  document.getElementById("showUnavailable").addEventListener("change", function() {
    calendar.getEventSources().forEach(function(s) { if (s.id === "unavailability") s.refetch(); });
  });

  // Populate filters
  fetch("/api/staff/").then(function(r) { return r.json(); }).then(function(d) {
    var sel = document.getElementById("staffFilter");
    var selectedStaff = new URLSearchParams(window.location.search).get("staff_id");
    d.forEach(function(s) {
      var o = document.createElement("option"); o.value = s.id; o.textContent = s.full_name;
      o.style.borderLeft = "4px solid " + (s.color || "#ccc");
      sel.appendChild(o);
    });
    if (selectedStaff) {
      sel.value = selectedStaff;
      sel.dispatchEvent(new Event("change"));
    }
  });
  fetch("/api/services/").then(function(r) { return r.json(); }).then(function(d) {
    var sel = document.getElementById("serviceFilter");
    d.forEach(function(s) { var o = document.createElement("option"); o.value = s.id; o.textContent = s.name; sel.appendChild(o); });
  });
})();
</script>
<script src="{% static 'operations/schedule_staff_day.js' %}"></script>
{% endblock %}
