<div class="field{% if wide %} form-wide{% endif %}">
  <div class="appointment-field-label">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark" aria-hidden="true"> *</span>{% endif %}</label>
    {% if field.help_text %}{% with help_id=field.auto_id|add:"_helptext" %}{% include 'operations/includes/appointment_field_help.html' with label=field.label text=field.help_text %}{% endwith %}{% endif %}
  </div>
  {{ field }}
  {% if field.errors %}<div class="form-error">{{ field.errors }}</div>{% endif %}
</div>
