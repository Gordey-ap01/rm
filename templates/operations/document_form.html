{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" enctype="multipart/form-data" class="form">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Сохранить</button>
  <a class="button secondary" href="{{ cancel_url }}">Отмена</a>
</form>
{% endblock %}
