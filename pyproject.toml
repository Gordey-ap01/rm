[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rehab-center"
version = "0.2.0"
description = "Операционная система реабилитационного центра: расписание, балансы, специалисты, отчёты"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "RMcodex team" }]
keywords = ["django", "rehab", "scheduling", "ledger", "russia"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Healthcare Industry",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Database",
]
dependencies = [
    "Django==5.2.14",
    "psycopg[binary]==3.3.4",
    "gunicorn==23.0.0",
    "python-dotenv==1.0.1",
    "dj-database-url==2.2.0",
    "whitenoise==6.8.2",
    "django-auditlog==3.0.0",
    "django-tasks==0.6.0",
    "django-htmx==1.27.0",
    "django-ninja>=1.6.0",
    "python-docx==1.2.0",
    "reportlab==4.5.1",
]

[project.optional-dependencies]
postgresql = [
    "psycopg[binary]==3.3.4",
]
dev = [
    "pytest==8.3.4",
    "pytest-django==4.9.0",
    "pytest-cov==6.0.0",
    "factory-boy==3.3.1",
    "freezegun==1.5.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "django-stubs[compatible-mypy]==5.1.3",
    "types-python-dateutil==2.9.0.20241206",
    "pre-commit==4.0.1",
]
packaging = [
    "pyinstaller==6.12.0",
    "pyinstaller-hooks-contrib==2024.11",
]

[project.urls]
Repository = "https://example.local/rehab-center"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["rehab_center*", "operations*"]
exclude = ["dist*", "data*", "docs*", "media*", "scripts*", "static*", "templates*", "tests*", "oldWorkMDprd*"]

[tool.setuptools.package-data]
operations = ["migrations/*.py"]
rehab_center = ["py.typed"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rehab_center.settings"
python_files = ["test_*.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources",
]

[tool.coverage.run]
source = ["operations", "rehab_center"]
omit = ["*/migrations/*", "*/tests/*", "*/management/commands/seed_demo.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@abstractmethod",
]
show_missing = true
skip_covered = false
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dist", "data", "docs", "media", "staticfiles", ".venv", "oldWorkMDprd"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "DJ001",  # allow null=True on CharField (we have it for legacy fields)
    "DJ012",  # method ordering: we keep clean() before save() by convention
    "N818",   # exception names (we have a mix)
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode in Russian text is intentional
    "RUF012",  # mutable class default is common in Django Meta / forms
]

[tool.ruff.lint.per-file-ignores]
"operations/migrations/*" = ["E", "F", "I", "N", "UP", "SIM"]
"dist/*" = ["ALL"]
"scripts/*" = ["TID"]
"**/tests.py" = ["B011"]
"**/seed_demo.py" = ["E", "F", "N"]
"operations/api.py" = ["N815"]

[tool.ruff.lint.isort]
known-first-party = ["rehab_center", "operations"]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
mypy_path = "."
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = false
no_implicit_optional = false
check_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["no-untyped-def", "no-untyped-call", "union-attr", "misc", "attr-defined", "arg-type"]

[[tool.mypy.overrides]]
module = ["operations.migrations.*", "rehab_center.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["operations.tests.*", "operations.management.commands.seed_demo"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "rehab_center.settings"
