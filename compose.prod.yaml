services:
  volume-init:
    build: .
    user: "0:0"
    command: sh -ec "chown -R rehab:rehab /app/media /app/private-artifacts"
    network_mode: "none"
    volumes:
      - media-data:/app/media
      - private-artifact-data:/app/private-artifacts
    restart: "no"

  archive-maintenance:
    build: .
    user: "0:0"
    command: ["true"]
    network_mode: "none"
    restart: "no"

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - media-data:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -ec "if test -e /app/private-artifacts/.restore-in-progress;
             then grep -q '^STATUS=validated$' /app/private-artifacts/.restore-in-progress ||
             { test \"$$RESTORE_CANDIDATE_START\" = '1' &&
               grep -q '^STATUS=candidate$' /app/private-artifacts/.restore-in-progress; } ||
             { echo 'Incomplete restore detected; web startup is blocked.' >&2; exit 1; }; fi;
             python manage.py collectstatic --noinput &&
             gunicorn rehab_center.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 90"
    env_file:
      - .env.production
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_RUNTIME_USER}
      DATABASE_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD}
      RESTORE_CANDIDATE_START: "0"
    volumes:
      - media-data:/app/media
      - private-artifact-data:/app/private-artifacts
    depends_on:
      volume-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  migration:
    build: .
    user: "0:0"
    restart: "no"
    command: python /app/scripts/migrate_prod.py
    env_file:
      - .env.production
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - media-data:/app/media
      - private-artifact-data:/app/private-artifacts
      - ./.runtime:/app/.runtime
    depends_on:
      volume-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres-data:
  media-data:
  private-artifact-data:
  caddy-data:
  caddy-config:
