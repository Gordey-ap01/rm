name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Django and PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rehab_ci
          POSTGRES_USER: rehab_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rehab_ci -d rehab_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://rehab_ci@127.0.0.1:5432/rehab_ci
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install application and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Apply migrations to clean PostgreSQL
        run: python manage.py migrate --noinput

      - name: Check Django configuration and migration state
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Lint Python
        run: python -m ruff check operations rehab_center

      - name: Run full test suite
        run: python -m pytest -q --tb=short
