name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Django and PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rehab_ci
          POSTGRES_USER: rehab_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rehab_ci -d rehab_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://rehab_ci@127.0.0.1:5432/rehab_ci
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install application and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Apply migrations to clean PostgreSQL
        run: python manage.py migrate --noinput

      - name: Check Django configuration and migration state
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Lint Python
        run: >-
          python -m ruff check operations rehab_center
          scripts/restore_files.py scripts/fsync_backup.py scripts/migrate_prod.py

      - name: Verify production dependency manifests
        run: python scripts/verify_dependency_manifests.py

      - name: Validate production scripts and Compose config
        run: |
          bash -n scripts/_production_common.sh scripts/backup_prod.sh scripts/verify_backup_prod.sh scripts/restore_prod.sh scripts/production_preflight.sh scripts/restore_drill_ci.sh scripts/deploy_prod.sh
          cp .env.production.example .env.production
          trap 'rm -f .env.production .env.preflight-ci' EXIT
          cp .env.production.example .env.preflight-ci
          sed -i 's/CHANGE_ME_LONG_RANDOM_SECRET/preflight-ci-secret-not-for-production/' .env.preflight-ci
          sed -i 's/CHANGE_ME_LONG_DATABASE_PASSWORD/preflight-ci-password-not-for-production/' .env.preflight-ci
          sed -i 's/CHANGE_ME_LONG_RUNTIME_DATABASE_PASSWORD/preflight-ci-runtime-password-not-for-production/' .env.preflight-ci
          sed -i 's/CHANGE_ME_SMTP_PASSWORD/preflight-ci-smtp-password-not-for-production/' .env.preflight-ci
          sed -i 's/rm.example.ru/preflight-ci.test/g' .env.preflight-ci
          sed -i 's/smtp.example.ru/smtp.preflight-ci.test/' .env.preflight-ci
          sed -i 's/no-reply@example.ru/no-reply@preflight-ci.test/g' .env.preflight-ci
          docker compose --env-file .env.preflight-ci -f compose.prod.yaml config --quiet
          docker compose --env-file .env.preflight-ci -f compose.prod.yaml -f compose.restore.yaml config --quiet
          bash scripts/production_preflight.sh --config-only --env-file .env.preflight-ci

      - name: Prove production backup and restore drill
        run: CI=true bash scripts/restore_drill_ci.sh

      - name: Run full test suite
        run: python -m pytest -q --tb=short
