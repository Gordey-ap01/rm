services:
  volume-init:
    build: .
    user: "0:0"
    command: sh -ec "chown -R rehab:rehab /app/media /app/private-artifacts"
    volumes:
      - media-data:/app/media
      - private-artifact-data:/app/private-artifacts
    restart: "no"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://rehab:rehab_dev_password@db:5432/rehab_center
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,testserver}
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    volumes:
      - .:/app
      - media-data:/app/media
      - private-artifact-data:/app/private-artifacts
    depends_on:
      volume-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rehab_center}
      POSTGRES_USER: ${POSTGRES_USER:-rehab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rehab_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rehab} -d ${POSTGRES_DB:-rehab_center}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres-data:
  media-data:
  private-artifact-data:
